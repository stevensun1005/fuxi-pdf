name: Validate skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check_package.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_coverage.py examples/coverage.csv --inventory examples/inventory.json
